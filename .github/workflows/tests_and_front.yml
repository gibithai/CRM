name: Receive Dispatch

on:
  repository_dispatch:
    types: [frontend-deployed]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print payload
        run: |
          echo "🎉 Dispatch received!"
          echo "Ref: ${{ github.event.client_payload.ref }}"
          echo "SHA: ${{ github.event.client_payload.sha }}"
