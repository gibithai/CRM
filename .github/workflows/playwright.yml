name: Playwright Tests
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [frontend-deployed]
concurrency:
  group: qa-playwright-${{ github.ref }}
  cancel-in-progress: false
jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Set env file
        run: 'echo "$TEST_ENV" >> .env'
        shell: bash
        env:
          TEST_ENV: ${{ secrets.PLAYWRIGHT_CRM_TEST_ENV }}
      - name: Run Playwright tests
        run: npm run test:qase

      - name: Install analyzer dependencies
        if: always()
        run: npm install fast-xml-parser --no-save

      - name: AI Failure Analysis → Slack
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/analyze-failures.mjs

      - name: Self-healing locator suggestions → Slack
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/self-heal-locators.mjs

      - name: "Self-healing: auto-fix broken locators (PR)"
        if: always()
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          SELF_HEAL_MIN_CONFIDENCE: high
        run: node scripts/self-healing.mjs

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifact-${{ github.run_id }}
          path: |
            playwright-report
            test-results
